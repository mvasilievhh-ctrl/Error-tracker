<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Журнал ошибок выписки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --paper: #FBF9F4;
    --ink: #1F2A24;
    --accent: #0F5C4C;
    --gold: #B8935A;
    --border: #D8D2C4;
    --danger: #A8452F;
    --muted: #7A7568;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 32px 16px;
  }

  .sheet {
    max-width: 940px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--border);
    box-shadow: 0 1px 0 var(--border);
  }

  .header {
    padding: 28px 32px 20px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 26px;
    margin: 0;
    font-weight: 700;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .form-panel {
    padding: 18px 32px;
    border-bottom: 1px dashed var(--border);
  }

  .form-panel label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 0.8fr 0.8fr 0.9fr 1.6fr 1fr auto;
    gap: 10px;
    align-items: end;
  }

  .form-panel input[type="file"] {
    padding: 7px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
  }

  .field { min-width: 0; }

  .form-panel input {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }

  .form-panel input[name="error"] {
    font-family: 'Inter', sans-serif;
  }

  .form-panel input:focus { outline: none; border-color: var(--accent); }

  .parse-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  .parse-btn:hover { background: #0B4A3D; }

  .parse-error {
    font-size: 12.5px;
    color: var(--danger);
    margin-top: 8px;
    display: none;
  }

  @media (max-width: 700px) {
    .form-row { grid-template-columns: 1fr 1fr; }
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 2px solid var(--ink);
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 14px;
    border-bottom: 1px dashed var(--border);
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: none; }

  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }

  .provider-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: #EFEAE0;
    color: var(--ink);
    white-space: nowrap;
  }

  .error-text {
    max-width: 320px;
    color: var(--ink);
    line-height: 1.4;
  }

  .time-cell { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .file-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: #E8F3EE;
    border: 1px solid #BFDFD2;
    border-radius: 4px;
    padding: 5px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .file-btn:hover { background: #DBEEE5; }

  .no-file {
    color: var(--muted);
    font-size: 12px;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 4px;
  }
  .del-btn:hover { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 36px 0;
  }

  .footer {
    padding: 16px 32px 24px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  @media (max-width: 640px) {
    .error-text { max-width: 180px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="header">
    <div>
      <div class="eyebrow">Журнал</div>
      <h1>Ошибки выписки</h1>
    </div>
    <div class="live-badge"><span class="live-dot"></span> live из Telegram</div>
  </div>

  <div class="form-panel">
    <div class="form-row">
      <div class="field">
        <label for="inpB2C">Заказ B2C</label>
        <input id="inpB2C" name="b2c" type="text" placeholder="7385" />
      </div>
      <div class="field">
        <label for="inpGTS">Заказ GTS</label>
        <input id="inpGTS" name="gts" type="text" placeholder="88602" />
      </div>
      <div class="field">
        <label for="inpProvider">Провайдер</label>
        <input id="inpProvider" name="provider" type="text" placeholder="Тестовый" />
      </div>
      <div class="field">
        <label for="inpError">Сообщение ошибки</label>
        <input id="inpError" name="error" type="text" placeholder="Неизвестная ошибка со стороны поставщика..." />
      </div>
      <div class="field">
        <label for="inpFile">Файл (.txt)</label>
        <input id="inpFile" name="file" type="file" accept=".txt,text/plain" />
      </div>
      <button class="parse-btn" id="addBtn">Добавить</button>
    </div>
    <div class="parse-error" id="parseError">Заполните хотя бы одно поле.</div>
  </div>

  <div class="table-wrap">
    <table id="logTable">
      <thead>
        <tr>
          <th>Время</th>
          <th>Заказ B2C</th>
          <th>Заказ GTS</th>
          <th>Провайдер</th>
          <th>Ошибка</th>
          <th>Файл</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
    <div class="empty" id="emptyState">Пока нет записей — они появятся сами, как только бот пришлёт сообщение в группу</div>
  </div>

  <div class="footer" id="countFooter">0 записей</div>
</div>

<script>
  let logs = [];

  async function load() {
    try {
      const res = await fetch('/api/entries');
      logs = await res.json();
    } catch (e) {
      console.error('Load error', e);
      logs = [];
    }
    render();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  async function buildEntry() {
    const b2c = document.getElementById('inpB2C').value.trim();
    const gts = document.getElementById('inpGTS').value.trim();
    const provider = document.getElementById('inpProvider').value.trim();
    const error = document.getElementById('inpError').value.trim();
    const fileInput = document.getElementById('inpFile');
    const file = fileInput.files[0];

    if (!b2c && !gts && !provider && !error && !file) return null;

    let file_name = null;
    let file_content = null;
    if (file) {
      try {
        file_content = await readFileAsText(file);
        file_name = file.name;
      } catch (e) {
        console.error('File read error', e);
      }
    }

    return { b2c, gts, provider, error, file_name, file_content };
  }

  function render() {
    const body = document.getElementById('logBody');
    const empty = document.getElementById('emptyState');
    const table = document.getElementById('logTable');
    const footer = document.getElementById('countFooter');

    if (logs.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
    } else {
      table.style.display = '';
      empty.style.display = 'none';
      body.innerHTML = logs.map((l) => `
        <tr>
          <td class="time-cell">${escapeHtml(l.time)}</td>
          <td class="mono">${escapeHtml(l.b2c)}</td>
          <td class="mono">${escapeHtml(l.gts)}</td>
          <td><span class="provider-tag">${escapeHtml(l.provider)}</span></td>
          <td class="error-text">${escapeHtml(l.error)}</td>
          <td>${l.file_name ? `<button class="file-btn" onclick="downloadFile(${l.id})">📎 ${escapeHtml(l.file_name)}</button>` : '<span class="no-file">—</span>'}</td>
          <td><button class="del-btn" onclick="removeLog(${l.id})" title="Удалить">✕</button></td>
        </tr>
      `).join('');
    }

    footer.textContent = `${logs.length} ${plural(logs.length)}`;
  }

  function plural(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'запись';
    if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'записи';
    return 'записей';
  }

  window.removeLog = async function(id) {
    await fetch(`/api/entries/${id}`, { method: 'DELETE' });
    load();
  };

  window.downloadFile = function(id) {
    const entry = logs.find(l => l.id === id);
    if (!entry || !entry.file_content) return;
    const blob = new Blob([entry.file_content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = entry.file_name || 'file.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  document.getElementById('addBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('parseError');
    const entry = await buildEntry();

    if (!entry) {
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    await fetch('/api/entries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });

    ['inpB2C', 'inpGTS', 'inpProvider', 'inpError'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('inpFile').value = '';
    document.getElementById('inpB2C').focus();
    load();
  });

  document.querySelectorAll('.form-panel input').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && inp.type !== 'file') document.getElementById('addBtn').click();
    });
  });

  load();
  setInterval(load, 5000); // pick up new messages the bot adds automatically
</script>

</body>
</html>
